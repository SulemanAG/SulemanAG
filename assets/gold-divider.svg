<svg width="1200" height="26" viewBox="0 0 1200 26" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="13" x2="1200" y2="13" stroke="#1E232F" stroke-width="1"/>

  <rect x="-200" y="9" width="200" height="8" fill="url(#pulseGrad)">
    <animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/>
  </rect>

  <circle cx="600" cy="13" r="2.5" fill="#D4AF37">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
