<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#radarBg)" stroke="#1E232F" stroke-width="1.5"/>

  <!-- concentric rings -->
  <g fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.28">
    <circle cx="160" cy="160" r="120"/>
    <circle cx="160" cy="160" r="85"/>
    <circle cx="160" cy="160" r="50"/>
  </g>

  <!-- crosshair -->
  <g stroke="#1E232F" stroke-width="1">
    <line x1="160" y1="10" x2="160" y2="310"/>
    <line x1="10" y1="160" x2="310" y2="160"/>
  </g>

  <!-- abstract bat-inspired geometry, very subtle -->
  <g fill="#D4AF37" opacity="0.10">
    <path d="M160 140 L120 165 L145 165 L100 195 L160 178 L220 195 L175 165 L200 165 Z"/>
  </g>

  <!-- rotating sweep -->
  <g>
    <path d="M160 160 L160 10 A150 150 0 0 1 240 40 Z" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing blips -->
  <circle cx="205" cy="110" r="3" fill="#D4AF37">
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="200" r="3" fill="#D4AF37">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="215" cy="215" r="2.5" fill="#D4AF37">
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <!-- outer ring highlight pulse -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="160" y="292" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#8B93A1" letter-spacing="2">SYSTEM SCAN</text>
</svg>
