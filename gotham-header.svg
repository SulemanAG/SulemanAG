<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- faint technical grid -->
  <g stroke="#161616" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
    <line x1="1050" y1="0" x2="1050" y2="280"/>
  </g>

  <!-- distant skyline silhouette -->
  <g fill="#0B0B0D" stroke="#161616" stroke-width="1">
    <rect x="20" y="190" width="40" height="90"/>
    <rect x="70" y="160" width="30" height="120"/>
    <rect x="110" y="205" width="50" height="75"/>
    <rect x="170" y="175" width="35" height="105"/>
    <rect x="960" y="185" width="45" height="95"/>
    <rect x="1015" y="150" width="30" height="130"/>
    <rect x="1055" y="200" width="55" height="80"/>
    <rect x="1120" y="170" width="35" height="110"/>
  </g>

  <!-- twinkling windows -->
  <g fill="#D4AF37">
    <rect x="30" y="205" width="4" height="6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="45" y="230" width="4" height="6"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="80" y="185" width="4" height="6"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite"/></rect>
    <rect x="125" y="225" width="4" height="6"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="980" y="210" width="4" height="6"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.9s" repeatCount="indefinite"/></rect>
    <rect x="1025" y="175" width="4" height="6"><animate attributeName="opacity" values="0.75;0.1;0.75" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="1070" y="220" width="4" height="6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- gold scan line sweeping down once per cycle -->
  <rect x="0" y="0" width="1200" height="2" fill="#D4AF37" opacity="0.35">
    <animate attributeName="y" values="0;280;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="600" y="128" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="46" fill="#F2F2F2" letter-spacing="4">SULEMAN AGASIMANI</text>

  <!-- identity line -->
  <text x="600" y="164" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#D4AF37" letter-spacing="3">BACKEND ENGINEERING • DISTRIBUTED SYSTEMS • AI RESEARCH</text>

  <!-- thin illuminated rule -->
  <line x1="420" y1="185" x2="780" y2="185" stroke="#D4AF37" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <rect width="1200" height="90" y="190" fill="url(#fog)"/>
</svg>
